<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아파트 옵션 관리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#122D43">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="옵션관리">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: sticky app bar (단지 + 탭) over one working column; the unit view pairs a building
   elevation (층 × 라인) with a detail sheet, the compare view stacks pickers over a matrix. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --line:#D3DAE4; --line-2:#E4E9F0;
  --ink:#16202F; --ink-2:#4E5D76; --ink-3:#8290A6;
  --accent:#1D4FD7; --accent-ink:#163FAE; --accent-soft:#E2EAFD; --on-accent:#FFFFFF;
  --k1:#1D4FD7; --k1s:#E2EAFD; --k2:#B4510A; --k2s:#FBE8D6; --k3:#0B7566; --k3s:#D6F1EA; --k4:#6D38B8; --k4s:#ECE2FA;
  --base-bar:#C9D1DD; --danger:#B83227; --danger-soft:#FBE4E1; --ok:#0B7566;
  --shadow:0 1px 2px rgba(22,32,47,.06),0 4px 14px rgba(22,32,47,.05); --hover:rgba(29,79,215,.06);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,"Malgun Gothic",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141C; --surface:#171F2A; --surface-2:#202A38; --line:#2F3B4E; --line-2:#263141;
    --ink:#E6ECF5; --ink-2:#A5B2C6; --ink-3:#70809A;
    --accent:#7FA3FF; --accent-ink:#B9CCFF; --accent-soft:#1B2D55; --on-accent:#0B1430;
    --k1:#9DB8FF; --k1s:#1B2D55; --k2:#F2A566; --k2s:#47290F; --k3:#59D0BA; --k3s:#0F3B34; --k4:#BC9CF3; --k4s:#33235A;
    --base-bar:#3A475B; --danger:#F08A80; --danger-soft:#4A1D19; --ok:#59D0BA;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --hover:rgba(127,163,255,.09);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#171F2A; --surface-2:#202A38; --line:#2F3B4E; --line-2:#263141;
  --ink:#E6ECF5; --ink-2:#A5B2C6; --ink-3:#70809A;
  --accent:#7FA3FF; --accent-ink:#B9CCFF; --accent-soft:#1B2D55; --on-accent:#0B1430;
  --k1:#9DB8FF; --k1s:#1B2D55; --k2:#F2A566; --k2s:#47290F; --k3:#59D0BA; --k3s:#0F3B34; --k4:#BC9CF3; --k4s:#33235A;
  --base-bar:#3A475B; --danger:#F08A80; --danger-soft:#4A1D19; --ok:#59D0BA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --hover:rgba(127,163,255,.09);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h2{font-size:16px;font-weight:700;text-wrap:balance}
h3{font-size:14px;font-weight:600}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.logo{display:grid;grid-template-columns:repeat(3,5px);gap:2px;padding:4px;border:1.5px solid var(--accent);border-radius:3px}
.logo i{width:5px;height:4px;background:var(--line)} .logo i.on{background:var(--accent)}
.proj-l{display:none}
.proj select{min-width:0;max-width:min(320px,62vw);padding:6px 28px 6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-weight:600}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
.tabs a{padding:7px 13px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:600;white-space:nowrap}
.tabs a:hover{background:var(--surface-2);color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.save{font-size:12px;color:var(--ink-3);white-space:nowrap}
#notice .wrap>div{margin-top:12px;padding:9px 12px;border:1px solid var(--line);border-left:3px solid var(--k2);background:var(--surface);border-radius:6px;font-size:13px;color:var(--ink-2)}
main.wrap{padding-block:18px 56px;display:flex;flex-direction:column;gap:18px}

/* building blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel-h{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.panel-h .sp{margin-left:auto}
.panel-b{padding:14px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13px;line-height:1.35;text-align:left}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.u{font-family:var(--mono);font-size:12px;padding:3px 7px;border-radius:5px;min-width:46px;justify-content:center}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);min-width:0}
.field input,.field select,.inp{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:13px;min-width:0;max-width:100%}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;line-height:1.55;font-weight:600}
.k0{color:var(--ink-2)} .pill.k0{background:var(--surface-2)}
.k1{background:var(--k1s);color:var(--k1)} .k2{background:var(--k2s);color:var(--k2)} .k3{background:var(--k3s);color:var(--k3)} .k4{background:var(--k4s);color:var(--k4)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:baseline;margin-right:5px}
.dot.k0{background:var(--base-bar)} .dot.k1{background:var(--k1)} .dot.k2{background:var(--k2)} .dot.k3{background:var(--k3)} .dot.k4{background:var(--k4)}
.flag{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid var(--ink-3);vertical-align:middle}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--ink-2);background:var(--surface)}
.scroll-x{overflow-x:auto;max-width:100%}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
.empty h2{margin-bottom:6px;color:var(--ink)}

/* overview */
.stats{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.stat{flex:1 1 130px;padding:12px 16px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);margin:0 -1px -1px 0}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:12px;color:var(--ink-2)}
.dists{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:16px 28px}
.dist{display:flex;flex-direction:column;gap:5px;min-width:0}
.dist-h{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.dist-h b{font-weight:600}
.dist-h span{font-size:12px;color:var(--ink-2);margin-left:auto}
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--surface-2);gap:1px}
.seg{min-width:0} .seg.k0{background:var(--base-bar)} .seg.k1{background:var(--k1)} .seg.k2{background:var(--k2)} .seg.k3{background:var(--k3)} .seg.k4{background:var(--k4)}
.legend{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;color:var(--ink-2)}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.grid th,.grid td{padding:6px 10px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);text-align:center;vertical-align:middle;background:var(--surface)}
.grid thead th{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--ink-2);position:sticky;top:0;z-index:2;max-width:150px;min-width:64px;overflow-wrap:anywhere}
.grid th.stick,.grid td.stick{position:sticky;left:0;z-index:1;text-align:left;white-space:nowrap}
.grid thead th.stick{z-index:3}
.grid tfoot td,.grid tfoot th{background:var(--surface-2);font-weight:600}
.grid td.na{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 4px,var(--surface-2) 4px,var(--surface-2) 5px)}
.grid td.z{color:var(--ink-3)}
.grid th button{all:unset;cursor:pointer;display:block;width:100%}
.grid th button:focus-visible{outline:2px solid var(--accent)}

/* unit view */
.uv{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:18px;align-items:start}
.elev{display:grid;gap:3px;align-items:center;justify-content:start}
.elev .fl{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right;padding-right:6px}
.elev .ln{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:center}
.cell{width:46px;height:24px;border:1px solid var(--line);border-radius:3px;background:var(--surface);font-family:var(--mono);font-size:11px;cursor:pointer;padding:0;color:var(--ink-2)}
.cell.none{border-style:dashed;border-color:var(--line-2);background:transparent;cursor:default}
.cell.k0,.cell.p0{background:var(--surface-2);color:var(--ink-2)}
.cell.k1{background:var(--k1s);color:var(--k1);border-color:var(--k1)} .cell.k2{background:var(--k2s);color:var(--k2);border-color:var(--k2)} .cell.k3{background:var(--k3s);color:var(--k3);border-color:var(--k3)} .cell.k4{background:var(--k4s);color:var(--k4);border-color:var(--k4)}
.cell.p1{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--ink)}
.cell.p2{background:color-mix(in srgb,var(--accent) 38%,var(--surface));color:var(--ink)}
.cell.p3{background:color-mix(in srgb,var(--accent) 64%,var(--surface));color:var(--on-accent)}
.cell.p4{background:var(--accent);color:var(--on-accent)}
.cell.na{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 4px,var(--surface-2) 4px,var(--surface-2) 5px);color:var(--ink-3)}
.cell[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px;font-weight:600}
.cell:hover:not(.none){filter:brightness(.96)}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;border:1px solid var(--line);margin-right:5px;vertical-align:baseline}
.unit-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.unit-h .no{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em}
.kv{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:13px;color:var(--ink-2)}
.kv b{color:var(--ink);font-weight:500}
.olist{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr);gap:4px 16px;padding:10px 0;border-top:1px solid var(--line-2);align-items:start}
.orow:first-child{border-top:0}
.orow .on{font-weight:600}
.orow .apply{font-size:12px;color:var(--ink-3);font-weight:400}
.choices{display:flex;flex-wrap:wrap;gap:5px}
.choice{padding:3px 10px;border:1px solid var(--line-2);border-radius:5px;font-size:13px;color:var(--ink-3)}
.choice.sel{font-weight:600;border-color:transparent}
.choice.sel.k0{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.prev{font-size:12px;color:var(--ink-2);margin-top:4px}

/* compare */
.cmp-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.pick{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.pick-g{display:flex;flex-direction:column;gap:5px}
.pick-g .gh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.pick-g .gh b{color:var(--ink);font-size:13px}
.units{display:flex;flex-wrap:wrap;gap:4px}
.matrix{max-height:70vh;overflow:auto;border-top:1px solid var(--line-2)}
.matrix .grid td{white-space:nowrap}
.ucell{display:flex;gap:8px;align-items:center}
.ucell .t{font-size:11px;color:var(--ink-3)}
.chg{font-size:11px;color:var(--ink-3);margin-left:4px}

/* manage */
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px;align-items:start}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:22px 16px;text-align:center;color:var(--ink-2);background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.demo-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;font-size:13px;background:var(--surface)}
.oedit{border:1px solid var(--line-2);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mparts{display:flex;flex-direction:column;gap:6px}
.mpart{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;background:var(--surface)}
.mpart.bad{border-color:#FCA5A5}
.mpart .mpn{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.mpart .mpm{flex:1 1 220px;min-width:0}
.mpart .mpf{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpart .mps{font-size:12px;color:var(--ink-2);margin-top:1px}
.mpart .mpb{flex:none;margin-left:auto}
.btn.over{outline:2px dashed var(--accent);outline-offset:2px}
.oedit .ch{display:flex;gap:6px;align-items:center}
.oedit .ch input[type=text]{flex:1}
.err{color:var(--danger)} .warn{color:var(--k2);background:transparent}
.steps{display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
/* v4 */
.undo{display:inline-flex;align-items:center;gap:5px}
.undo svg{width:14px;height:14px;flex:none}
#toast.act{pointer-events:auto}
.tbtn{margin-left:14px;padding:3px 10px;border:1px solid currentColor;border-radius:5px;background:transparent;color:inherit;font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.conds{display:flex;flex-direction:column;gap:8px}
.cond{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg)}
.cond select{max-width:min(240px,100%)}
.cond .row{flex:1 1 220px;gap:4px}
.cond .chip{font-size:12px;padding:2px 9px}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line-2);background:var(--bg)}
.bulk select{max-width:min(260px,100%)}
.bk-confirm{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--k2);border-radius:6px;background:var(--k2s);color:var(--ink)}
.cell.hit{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cell.miss{opacity:.4}
.cell.fl{color:#16202F}
.hlist{display:flex;flex-direction:column;gap:12px}
.hg{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.hg>header{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.hg>header time{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.hg.undone>header b{text-decoration:line-through;color:var(--ink-2)}
.hg table{width:100%;table-layout:fixed}
.hg .grid td{overflow-wrap:anywhere}
.hg .grid td:nth-child(1){width:112px}
.hg .grid td:nth-child(2){width:26%}
.hg .grid td:nth-child(3){width:30%}
.hg .grid td.ar{width:28px}
.hg.undone .grid td{color:var(--ink-3)}
@media (max-width:520px){ .hg .grid td:nth-child(1){width:84px} .hg .grid td:nth-child(2){width:24%} }
.hg .grid td{text-align:left;padding:5px 10px}
.hg .grid td.ar{color:var(--ink-3);width:24px;text-align:center;padding:5px 2px}
.hg .grid td.fr{color:var(--ink-2)}
.hg .grid td.to{font-weight:600}
.hg .more{padding:8px 14px}
.lnk{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}
a.lnk{font-family:var(--font)}
.lnk:focus-visible{outline:2px solid var(--accent)}
.uhist{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.uhist time{font-family:var(--mono);color:var(--ink-3);margin-right:6px}
.uhist s{color:var(--ink-3)}
.diffbox{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.dsums{display:flex;flex-wrap:wrap;gap:6px}
.flagrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{outline:2px solid var(--ink)}
.mrad{display:flex;gap:8px;align-items:flex-start}
.mrad input{margin-top:4px}
.mrad .hint{display:block}
/* v3 */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.ptitle{display:flex;flex-direction:column;gap:6px;min-width:0}
.ptitle h1{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.pmeta{display:flex;flex-wrap:wrap;gap:6px}
